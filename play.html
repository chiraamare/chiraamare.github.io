<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playing - Filmo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
        }
        
        .player-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 80px; 
            z-index: 10; pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .back-btn, .episodes-btn, .episode-nav-btn { 
            pointer-events: auto;
            position: absolute; top: 20px; z-index: 100; color: white; text-decoration: none; 
            font-size: 1rem; font-weight: 600; background: rgba(0,0,0,0.6); padding: 10px 18px; 
            border-radius: 30px; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; cursor: pointer; white-space: nowrap;
        }

        .back-btn { left: 20px; }
        .episodes-btn { right: 20px; }
        .episode-nav-btn { position: fixed; padding: 12px 14px; top: 50%; transform: translateY(-50%); z-index: 100; opacity: 0; transition: opacity 0.3s; }
        #previousEpisodeBtn { left: 20px; }
        #nextEpisodeBtn { right: 20px; }
        
        .iframe-container { flex: 1; width: 100%; height: 100%; position: relative; z-index: 1; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top: 0; left: 0; }

        /* Pop-up Modal Design */
        .episodes-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
            display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .episodes-modal {
            background: #0b0f14; width: 95%; max-width: 700px; height: 85vh; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 1.6rem; color: white; font-weight: 800; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        .modal-grid { 
            display: flex !important; 
            flex-direction: column !important; 
            gap: 12px !important; 
            overflow-y: scroll !important;
            padding-right: 5px !important; 
            flex: 1;
        }
        .modal-grid::-webkit-scrollbar { width: 5px; }
        .modal-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .modal-grid .episode-card { 
            display: grid !important;
            grid-template-columns: 140px 1fr !important;
            gap: 15px !important;
            background: rgba(255,255,255,0.05) !important; 
            border: 1px solid rgba(255,255,255,0.1) !important; 
            border-radius: 12px !important; 
            padding: 12px !important; 
            height: auto !important;
            min-height: 110px !important;
            transition: 0.3s; 
            text-decoration: none;
            align-items: center;
            flex-shrink: 0 !important;
        }
        .modal-grid .episode-card:hover { background: rgba(255,255,255,0.1) !important; border-color: #dc2626 !important; }
        
        /* Now Playing Style */
        .modal-grid .episode-card.is-current-episode { 
            background: linear-gradient(135deg, rgba(220,38,38,0.22), rgba(255,255,255,0.06)) !important;
            border-color: rgba(220,38,38,0.8) !important;
            box-shadow: 0 0 0 1px rgba(220,38,38,0.35), 0 12px 30px rgba(220,38,38,0.14) !important;
        }
        
        .modal-grid .ep-img-wrapper { 
            width: 100% !important; 
            aspect-ratio: 16/9 !important;
            border-radius: 8px !important; 
            overflow: hidden; 
            position: relative; 
            background: #222; 
        }
        .modal-grid .ep-img-wrapper img { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        
        .modal-grid .ep-info { display: flex !important; flex-direction: column !important; justify-content: center !important; }
        .ep-current-badge { display: inline-flex; align-self: flex-start; margin-bottom: 6px; padding: 5px 9px; border-radius: 999px; background: rgba(220,38,38,0.95); color: white; font-size: 10px; font-weight: 800; text-transform: uppercase; }

        .modal-grid .ep-title { font-size: 15px !important; font-weight: 700 !important; color: white !important; margin-bottom: 4px !important; }
        .modal-grid .ep-desc { font-size: 12px !important; color: rgba(238, 241, 246, 0.6) !important; display: -webkit-box !important; -webkit-line-clamp: 3 !important; -webkit-box-orient: vertical !important; overflow: hidden !important; white-space: normal !important; line-height: 1.4; }

        .season-dropdown { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; width: 100%; margin-bottom: 15px; outline: none; cursor: pointer; }

        @media (max-width: 600px) {
            .modal-grid .episode-card { 
                grid-template-columns: 130px 1fr !important;
                min-height: 90px !important;
            }
            .modal-grid .ep-img-wrapper { width: 130px !important; }
            .back-btn, .episodes-btn { padding: 8px 15px; font-size: 0.8rem; top: 10px; }
            .episodes-btn { min-width: 96px; }
        }
    </style>
</head>
<body>

    <div class="player-controls">
        <a href="#" id="backBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <button id="showEpisodesBtn" class="episodes-btn" style="display: none;" onclick="toggleEpisodes()"><i class="fas fa-list"></i> Episodes</button>
    </div>

    <div class="player-actions">
        <a href="#" id="previousEpisodeBtn" class="episode-nav-btn" title="Previous Episode"><i class="fas fa-backward-step"></i></a>
        <a href="#" id="nextEpisodeBtn" class="episode-nav-btn" title="Next Episode"><i class="fas fa-forward-step"></i></a>
    </div>

    <div class="iframe-container">
        <iframe id="videoPlayer" allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
    </div>

    <div id="episodesOverlay" class="episodes-overlay">
        <div class="episodes-modal">
            <div class="modal-header">
                <h2 id="playTitle">Episodes</h2>
                <button class="close-btn" onclick="toggleEpisodes()"><i class="fas fa-times"></i></button>
            </div>
            <select id="playSeasonSelect" class="season-dropdown" onchange="changePlaySeason()"></select>
            <div id="playEpisodesGrid" class="episode-grid modal-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleEpisodes() {
            const overlay = document.getElementById('episodesOverlay');
            overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const imdb = params.get('imdb'), type = params.get('type'), s = params.get('s'), e = params.get('e'), id = params.get('id');
            const detailsUrl = params.get('detailsUrl') || (id ? `details.html?id=${id}&type=${type}` : 'index.html');
            const player = document.getElementById('videoPlayer');
            const backBtn = document.getElementById('backBtn');

            if (backBtn) backBtn.href = detailsUrl;

            if(imdb) {
                const subtitleHint = 'subtitleLang=en';
                player.src = (type === 'movie') ? 
                    `https://streamimdb.ru/embed/movie/${imdb}?${subtitleHint}` : 
                    `https://streamimdb.ru/embed/tv/${imdb}/${s || 1}/${e || 1}?${subtitleHint}`;

                if(type === 'tv' && id) {
                    document.getElementById('showEpisodesBtn').style.display = 'flex';
                    loadPlayEpisodes(id, imdb, s);
                }

                // මෙන්න උඹේ Index එකේ Continue Watching වැඩ කරන්න ඕන කෝඩ් එක
                if (window.saveContinueWatchingFromPlayback) {
                    await window.saveContinueWatchingFromPlayback({
                        type,
                        tmdbId: id || '',
                        imdbId: imdb,
                        season: s || '',
                        episode: e || '',
                        playUrl: window.location.href
                    });
                }
            }

            // Auto-hide Nav Buttons
            let hideTimeout;
            const navs = [document.getElementById('previousEpisodeBtn'), document.getElementById('nextEpisodeBtn')];
            function showNavs() {
                navs.forEach(n => { if(n) n.style.opacity = '1'; });
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => navs.forEach(n => { if(n) n.style.opacity = '0'; }), 3000);
            }
            window.addEventListener('pointermove', showNavs);
            window.addEventListener('touchstart', showNavs);
            showNavs();
        }
    </script>
</body>
</html>
