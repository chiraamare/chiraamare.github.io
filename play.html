<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Playing - Filmo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        /* Safari iOS: prevent content from going behind the URL bar / home indicator */
        body { height: 100vh; height: -webkit-fill-available; }
        html { height: -webkit-fill-available; }
        
        /* බටන් ප්ලේයර් එකේ මැදට එන්නේ නැති වෙන්න ඉඩ හැදුවා */
        .player-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 80px; 
            z-index: 10; pointer-events: none; /* ප්ලේයර් එක ඔබන්න බාධාවක් වෙන්නේ නෑ */
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }

        .back-btn, .episodes-btn { 
            pointer-events: auto; /* බටන් විතරක් ඔබන්න පුළුවන් */
            position: absolute; top: 20px; top: max(20px, env(safe-area-inset-top)); z-index: 100; color: white; text-decoration: none; 
            font-size: 1.1rem; font-weight: 600; background: rgba(0,0,0,0.6); padding: 10px 20px; 
            border-radius: 30px; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; cursor: pointer;
        }

        .back-btn { left: 20px; left: max(20px, env(safe-area-inset-left)); }
        .episodes-btn { right: 20px; right: max(20px, env(safe-area-inset-right)); }
        
        .back-btn:hover, .episodes-btn:hover { background: rgba(220,38,38,0.8); border-color: #dc2626; }
        
        /* Full Screen එකට ගැලපෙන්න Iframe එක හැදුවා */
        .iframe-container {
            width: 100%;
            /* Use svh so the iframe never extends under Safari's URL bar */
            height: 100vh;
            height: -webkit-fill-available; /* Safari */
            height: 100svh;                  /* Modern browsers */
            position: relative; z-index: 1;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Modal Design */
        .episodes-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
            display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .episodes-modal {
            background: #0b0f14; width: 95%; max-width: 800px; height: 85vh; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 1.8rem; color: white; font-weight: 800; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .close-btn:hover { background: #dc2626; }

        .modal-grid { display: flex !important; flex-direction: column !important; gap: 20px !important; overflow-y: auto !important; padding-right: 10px !important; height: 100%; }
        .modal-grid::-webkit-scrollbar { width: 6px; }
        .modal-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .modal-grid .episode-card { 
            display: grid !important; grid-template-columns: 200px 1fr !important; gap: 20px !important;
            background: rgba(255,255,255,0.03) !important; border: 1px solid rgba(255,255,255,0.08) !important; 
            border-radius: 15px !important; padding: 12px !important; transition: 0.3s; text-decoration: none; align-items: center;
        }
        .modal-grid .episode-card:hover { background: rgba(255,255,255,0.08) !important; border-color: #dc2626 !important; transform: scale(1.01); }
        .modal-grid .ep-img-wrapper { width: 100% !important; aspect-ratio: 16/9 !important; border-radius: 10px !important; overflow: hidden; position: relative; background: #222; }
        .modal-grid .ep-img-wrapper img { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .modal-grid .ep-play-icon { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); opacity: 0; transition: 0.2s; font-size: 30px; color: white;}
        .modal-grid .episode-card:hover .ep-play-icon { opacity: 1; }
        .modal-grid .ep-info { display: flex !important; flex-direction: column !important; justify-content: center !important; }
        .modal-grid .ep-title { font-size: 1.1rem !important; font-weight: 700 !important; color: white !important; margin-bottom: 8px !important; }
        .modal-grid .ep-desc { font-size: 0.9rem !important; color: rgba(238, 241, 246, 0.6) !important; line-height: 1.4 !important; display: -webkit-box !important; -webkit-line-clamp: 3 !important; -webkit-box-orient: vertical !important; overflow: hidden !important; white-space: normal !important; }

        .season-dropdown { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-bottom: 25px; width: 100%; outline: none; }

        @media (max-width: 650px) {
            .modal-grid .episode-card { grid-template-columns: 1fr !important; }
            .modal-grid .ep-info { margin-top: 10px; }
            .modal-header h2 { font-size: 1.4rem; }
            .back-btn, .episodes-btn { padding: 8px 15px; font-size: 0.9rem; top: 10px; top: max(10px, env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

    <div class="player-controls">
        <a href="#" onclick="history.back(); return false;" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>
        <button id="showEpisodesBtn" class="episodes-btn" style="display: none;" onclick="toggleEpisodes()">
            <i class="fas fa-list"></i> Episodes
        </button>
    </div>

    <div class="iframe-container">
        <!-- Fullscreen වැඩ කරන්න අවශ්‍ය permissions ඔක්කොම මෙතන එකතු කළා -->
        <iframe id="videoPlayer" 
                allow="autoplay; fullscreen; picture-in-picture" 
                allowfullscreen 
                webkitallowfullscreen 
                mozallowfullscreen>
        </iframe>
    </div>

    <div id="episodesOverlay" class="episodes-overlay">
        <div class="episodes-modal">
            <div class="modal-header">
                <h2 id="playTitle">Episodes</h2>
                <button class="close-btn" onclick="toggleEpisodes()"><i class="fas fa-times"></i></button>
            </div>
            <select id="playSeasonSelect" class="season-dropdown" onchange="changePlaySeason()">
            </select>
            <div id="playEpisodesGrid" class="episode-grid modal-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleEpisodes() {
            const overlay = document.getElementById('episodesOverlay');
            overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const imdb = params.get('imdb');
            const type = params.get('type');
            const s = params.get('s'); 
            const e = params.get('e'); 
            const id = params.get('id'); 
            const player = document.getElementById('videoPlayer');
            
            if(imdb) {
                if(type === 'movie') {
                    player.src = `https://streamimdb.ru/embed/movie/${imdb}`;
                } else if(type === 'tv') {
                    player.src = `https://streamimdb.ru/embed/tv/${imdb}/${s}/${e}`;
                    if(id) {
                        document.getElementById('showEpisodesBtn').style.display = 'flex';
                        loadPlayEpisodes(id, imdb, s);
                    }
                }
            } else {
                document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:20%;">Video not found!</h2>';
            }
        }
    </script>
</body>
</html>
